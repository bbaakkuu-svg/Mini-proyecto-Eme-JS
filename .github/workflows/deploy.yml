name: Despliegue de Eme-JS a GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Permisos necesarios para autenticar y desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos y colisiones
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Job de validación (se ejecuta tanto en push como en pull_request a main)
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis y ejecución del proyecto
        run: |
          echo ">> Validando sintaxis de JavaScript..."
          node --check src/app.js
          echo ">> Ejecutando prueba de despacho del sistema..."
          node src/app.js

      - name: Configurar GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages (carpeta src)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

  # 2. Job de despliegue (se ejecuta únicamente al hacer push a main tras superar la validación)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4